name: Build AlTayyibat 2026 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare AlTayyibat 2026
        run: |
          rm -rf www
          mkdir -p www
          cp ui2026/index.html www/index.html
          cp ui2026/style.css www/style.css
          cp ui2026/app.js www/app.js

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlTayyibat-2026-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk      - name: Sync
        run: npx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: AlTayyibat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
